---
schema: 1
job: extension
config:
  name: ${JOB_NAME}
  process:
  - type: diffusion_trainer
    training_folder: ${OUTPUT_DIR}
    network:
      type: lora
      linear: 32
      linear_alpha: 32
    datasets:
    - folder_path: ${DATASET_DIR}
      caption_ext: txt
      caption_dropout_rate: 0.05
      shuffle_tokens: false
      cache_latents_to_disk: true
      resolution:
      - 632
      num_frames: 41
      fps: 16
    train:
      batch_size: 1
      gradient_accumulation: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      optimizer: adamw8bit
      lr: 0.0001
      lr_scheduler: constant
      noise_scheduler: flowmatch
      dtype: bf16
      loss_type: mse
      steps: 250
      content_or_style: balanced
      timestep_type: sigmoid
      cache_text_embeddings: true
    model:
      name_or_path: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
      arch: wan21
      quantize: false
      quantize_te: true
      qtype_te: qfloat8
    save:
      dtype: bf16
      save_format: diffusers
      save_every: 250
      max_step_saves_to_keep: 1
      push_to_hub: false
    logging:
      use_ui_logger: true
      use_wandb: false
    sample:
      sampler: flowmatch
      sample_every: 250
      sample_start_step: 0
      seed: 42
      walk_seed: false
      width: 832
      height: 480
      guidance_scale: 5
      sample_steps: 30
      num_frames: 41
      fps: 16
      format: webp
      samples:
      - prompt: A detailed portrait of [trigger] in natural light
